# wOS trusted verification for the product repo (waronsaas/suite). Template owned by the verification
# workstream in the platform repo (templates/suite/); changed in the product repo only by a maintainer PR.
#
# SECURITY.md S-20: this workflow and every other workflow in the product repo reference no secrets,
# declare `permissions: contents: read`, use no environments and no privileged triggers. Candidate code
# runs here, so there must be nothing here worth stealing. The result reaches the control plane through
# the check_suite webhook; only a conclusion for exactly the attempt's head sha counts (BUILD-PROTOCOL.md 8).
name: wos-verify

on:
  push:
    branches: ["wos/candidate/**", main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: wos-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wos-verify:
    name: wos-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull_request, test the exact reviewed head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: scope check (same validator as client and control plane)
        run: node .github/wos/wos-ci.mjs scope
      - name: install, verify steps, ABU acceptance checks
        run: node .github/wos/wos-ci.mjs verify
